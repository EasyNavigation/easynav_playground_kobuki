# Gazebo server (+ optional client) and the /clock bridge, no robots.

launch:
- arg:
    name: world
    default: $(find-pkg-share easynav_playground_kobuki)/worlds/small_house.world
    description: Gazebo world file
- arg: {name: gui, default: 'true', description: Set to false to run Gazebo headless}

# Gazebo finds the house models here
- set_env:
    name: GZ_SIM_RESOURCE_PATH
    value: $(find-pkg-share easynav_playground_kobuki)/models:$(env GZ_SIM_RESOURCE_PATH '')

- include:
    file: $(find-pkg-share ros_gz_sim)/launch/gz_sim.launch.py
    arg:
    - {name: gz_args, value: -r -s $(var world)}

- include:
    if: $(var gui)
    file: $(find-pkg-share ros_gz_sim)/launch/gz_sim.launch.py
    arg:
    - {name: gz_args, value: -g}

- node:
    pkg: ros_gz_bridge
    exec: parameter_bridge
    name: bridge_ros_gz_clock
    output: screen
    param:
    - {name: config_file, value: $(find-pkg-share easynav_playground_kobuki)/config/bridge/clock_bridge.yaml}
    - {name: use_sim_time, value: true}
